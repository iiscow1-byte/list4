<!--
  The All Levels List mark. Same geometry as components/AllLogo.vue — keep the
  two in step; this one has its colours written out because browser chrome
  cannot inherit anything from the page.

  Cyan is the site's default accent (see PRESETS.cyan in composables/useTheme.ts
  and the :root block in assets/css/main.css). A favicon cannot follow a theme
  the reader picked, so it uses the default rather than trying.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5" fill="#171717" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5"/>
  <g fill="none" stroke="#06b6d4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 15.5 16 8l7.5 7.5"/>
    <path d="M8.5 20.25h15"/>
    <path d="M8.5 25h8.5"/>
  </g>
</svg>
