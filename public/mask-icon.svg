<!--
  The monochrome cut of the mark, for a Safari pinned tab.

  Safari silhouettes this into a single flat shape and tints it, so strokes are
  converted to filled paths and the tile is dropped: an outlined square would
  silhouette into a solid block with the mark invisible inside it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <path fill="#000" d="M7.58 16.42a1.3 1.3 0 0 1 0-1.84l7.5-7.5a1.3 1.3 0 0 1 1.84 0l7.5 7.5a1.3 1.3 0 1 1-1.84 1.84L16 9.84l-6.58 6.58a1.3 1.3 0 0 1-1.84 0Z"/>
  <rect x="7.2" y="18.95" width="17.6" height="2.6" rx="1.3" fill="#000"/>
  <rect x="7.2" y="23.7" width="11.1" height="2.6" rx="1.3" fill="#000"/>
</svg>
